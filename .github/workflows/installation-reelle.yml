# Installation réelle filmée sur un poste de test de l'entreprise (runner GitHub auto-hébergé).
# Lancement manuel uniquement : Actions > « Installation réelle (poste de test) » > Run workflow.
# Guide : docs/POSTE_DE_TEST.md
name: Installation réelle (poste de test)

on:
  workflow_dispatch:
    inputs:
      comptes:
        description: "Comptes : local (créés pour le test) ou domaine (secrets HLM_*)"
        type: choice
        options: [local, domaine]
        default: local
      lmutil:
        description: "lmutil : test (outil de test, sans serveur de licences) ou reel (vrai lmutil et vrais serveurs)"
        type: choice
        options: [test, reel]
        default: test
      serveurs:
        description: "Serveurs de licences (NOM=port@serveur;NOM2=port@serveur2) — en mode reel, vos serveurs"
        type: string
        default: "AUTODESK=27000@licsrv-adsk;ANSYS=1055@licsrv-ansys"
      nettoyer:
        description: "Désinstaller et nettoyer le poste à la fin"
        type: boolean
        default: true

concurrency:
  group: poste-de-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  installation:
    name: Installation réelle filmée (poste de test)
    runs-on: [self-hosted, windows, heptagoneslm-test]
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      PUBLIC_HOST: heptagoneslm.test.local
      LICENSE_SERVERS: ${{ inputs.serveurs }}
      HLM_SVC_ACCOUNT: ${{ secrets.HLM_SVC_ACCOUNT }}
      HLM_SVC_PASSWORD: ${{ secrets.HLM_SVC_PASSWORD }}
      HLM_ACCESS_GROUP: ${{ secrets.HLM_ACCESS_GROUP }}
      HLM_TEST_USER: ${{ secrets.HLM_TEST_USER }}
      HLM_TEST_PASSWORD: ${{ secrets.HLM_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Nettoyage d'un essai précédent
        shell: powershell
        run: ./tests/windows/cleanup_test_pc.ps1

      - name: Construction de HeptagonesLM.exe et HeptagonesLM-Setup.exe
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
          pyinstaller --noconfirm --clean --onefile --console --name HeptagonesLM --icon packaging/heptagoneslm.ico `
            --collect-submodules heptagoneslm --add-data "heptagoneslm/web/static:heptagoneslm/web/static" `
            --add-data "heptagoneslm/setup/static:heptagoneslm/setup/static" heptagoneslm/launcher.py
          pyinstaller --noconfirm --onefile --console --uac-admin --name HeptagonesLM-Setup --icon packaging/heptagoneslm.ico `
            --collect-submodules heptagoneslm --add-data "heptagoneslm/web/static:heptagoneslm/web/static" `
            --add-data "heptagoneslm/setup/static:heptagoneslm/setup/static" --add-data "dist/HeptagonesLM.exe:." heptagoneslm/launcher.py
          ./dist/HeptagonesLM-Setup.exe --version

      - name: Navigateur de test (Playwright, Chromium)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium

      - name: Préparation du poste (comptes, certificat, nom DNS local, lmutil)
        shell: powershell
        run: ./tests/windows/prepare_test_pc.ps1 -Comptes ${{ inputs.comptes }} -Lmutil ${{ inputs.lmutil }} -PublicHost $env:PUBLIC_HOST -Exe dist\HeptagonesLM.exe

      - name: Assistant d'installation réel, piloté par le navigateur et filmé
        timeout-minutes: 60
        run: |
          $p = Start-Process .\dist\HeptagonesLM-Setup.exe -ArgumentList "setup", "--no-open", "--port", "8792", "--token", "poste-test" `
               -RedirectStandardOutput setup-gui.log -RedirectStandardError setup-gui.err -PassThru
          for ($i = 0; $i -lt 90; $i++) {
            if ((curl.exe -s -o NUL -w "%{http_code}" http://127.0.0.1:8792/setup.css) -ne "000") { break }
            Start-Sleep 1
          }
          node tests/ui/setup_real.cjs http://127.0.0.1:8792 poste-test installation-reelle
          $code = $LASTEXITCODE
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if ($code -ne 0) { Get-Content setup-gui.log, setup-gui.err -Tail 60 -ErrorAction SilentlyContinue; throw "parcours réel de l'assistant en échec" }

      - name: Contrôles après installation (SSO via IIS, groupes, collecte par le compte de service)
        run: ./tests/windows/post_install_checks.ps1

      - name: Visite filmée de l'interface installée
        continue-on-error: true
        run: node tests/ui/web_real_tour.cjs installation-reelle

      - name: Publication de la vidéo, des captures et des journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installation-reelle-poste-de-test
          path: |
            installation-reelle/
            setup-gui.log
            setup-gui.err
            C:/HeptagonesLM/logs/
            C:/HeptagonesLM/heptagoneslm.yaml
            C:/HeptagonesLM/iis/web.config
          if-no-files-found: warn

      - name: Désinstallation et nettoyage du poste
        if: always() && inputs.nettoyer
        shell: powershell
        run: ./tests/windows/cleanup_test_pc.ps1
