# Intégration continue + environnement de test simulé.
#
# - tests      : tests unitaires + démo (historique simulé, collecte en direct via
#                le faux lmutil, rapport Excel) sous Linux et Windows.
# - sqlserver  : la même démo contre un vrai SQL Server 2022 (conteneur).
#
# Les rapports Excel générés sont téléchargeables dans l'onglet « Actions »
# du dépôt, section « Artifacts » de chaque exécution.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      days:
        description: "Nombre de jours d'historique simulé"
        default: "30"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Tests + démo (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Installation
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests unitaires
        run: python -m pytest -v

      - name: Script SQL Server à jour
        if: runner.os == 'Linux'
        run: heptagoneslm ddl --dialect mssql | diff - sql/sqlserver/01_schema.sql

      - name: Démo - historique simulé et rapport Excel
        run: heptagoneslm demo --days "${{ inputs.days || '30' }}" --output-dir demo

      - name: Démo - collecte en direct avec le faux lmutil
        run: |
          heptagoneslm -c demo/heptagoneslm.demo.yaml test-server --server AUTODESK
          heptagoneslm -c demo/heptagoneslm.demo.yaml collect
          heptagoneslm -c demo/heptagoneslm.demo.yaml collect
          heptagoneslm -c demo/heptagoneslm.demo.yaml report --period last-7d -o demo/reports/HeptagonesLM_7_derniers_jours.xlsx
          heptagoneslm -c demo/heptagoneslm.demo.yaml report --period last-7d -o demo/reports/HeptagonesLM_7_derniers_jours.xlsx --skip-existing

      - name: Vérification des classeurs Excel
        run: |
          python - <<'EOF'
          import glob
          from openpyxl import load_workbook
          files = sorted(glob.glob("demo/reports/*.xlsx"))
          assert files, "aucun rapport généré"
          for path in files:
              wb = load_workbook(path)
              print(path)
              for ws in wb.worksheets:
                  print(f"  {ws.title:<16} {ws.max_row:>6} lignes  {len(ws.tables)} tableau(x)")
              assert wb["Synthèse"].max_row > 5, "synthèse vide"
              assert wb["Sessions"].max_row > 5, "aucune session"
          EOF

      - name: Rendu PDF du rapport (LibreOffice)
        if: runner.os == 'Linux' && matrix.python == '3.12'
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-calc > /dev/null
          soffice --headless --convert-to pdf --outdir demo/reports demo/reports/HeptagonesLM_demo_*.xlsx

      - name: Publication du rapport de démonstration
        if: always() && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: rapport-demo-${{ runner.os }}
          path: |
            demo/reports/
            demo/logs/
            demo/heptagoneslm.demo.yaml
          if-no-files-found: warn

  ui:
    name: Interface web (navigateur)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installation
        run: |
          pip install -e ".[dev]"
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Démarrage de l'interface (données de démonstration)
        run: |
          heptagoneslm web --demo --demo-days 60 --port 8765 > web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8765/api/meta > /dev/null && break; sleep 1; done
          curl -sf localhost:8765/api/meta > /dev/null || (cat web.log; exit 1)

      - name: Test de bout en bout (Playwright)
        run: node tests/ui/ui_smoke.cjs http://localhost:8765 ui-captures

      - name: Connexion Windows/AD (annuaire factice)
        run: |
          python tests/ui/fake_auth_server.py 8766 > auth.log 2>&1 &
          for i in $(seq 1 60); do grep -q "prêt" auth.log && break; sleep 1; done
          node tests/ui/login_smoke.cjs http://localhost:8766 ui-captures

      - name: Assistant d'installation (simulation)
        run: |
          heptagoneslm setup --simulate --no-open --port 8790 --token ci-token > setup.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null localhost:8790/setup.css && break; sleep 1; done
          node tests/ui/setup_smoke.cjs http://127.0.0.1:8790 ci-token ui-captures

      - name: Captures d'écran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-interface-web
          path: ui-captures/
          if-no-files-found: warn

  exe:
    name: Exécutable Windows (HeptagonesLM.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Construction
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
          pyinstaller --noconfirm --clean --onefile --console --name HeptagonesLM --icon packaging/heptagoneslm.ico \
            --collect-submodules heptagoneslm --add-data "heptagoneslm/web/static:heptagoneslm/web/static" \
            --add-data "heptagoneslm/setup/static:heptagoneslm/setup/static" heptagoneslm/launcher.py
          # Assistant d'installation : élévation administrateur, HeptagonesLM.exe embarqué
          pyinstaller --noconfirm --onefile --console --uac-admin --name HeptagonesLM-Setup --icon packaging/heptagoneslm.ico \
            --collect-submodules heptagoneslm --add-data "heptagoneslm/web/static:heptagoneslm/web/static" \
            --add-data "heptagoneslm/setup/static:heptagoneslm/setup/static" --add-data "dist/HeptagonesLM.exe:." heptagoneslm/launcher.py

      - name: Vérification de l'exécutable
        run: |
          cd dist
          ./HeptagonesLM.exe --version
          ./HeptagonesLM.exe demo --days 5 --output-dir exe-demo
          ./HeptagonesLM.exe -c exe-demo/heptagoneslm.demo.yaml collect
          ./HeptagonesLM.exe web --demo --demo-days 10 --port 8799 > web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8799/api/meta > /dev/null && break; sleep 1; done
          curl -sf localhost:8799/ | grep -q "HeptagonesLM"
          curl -sf "localhost:8799/api/report?type=summary" | grep -q "Synthèse"
          curl -sf "localhost:8799/api/export?type=full&format=xlsx" -o complet.xlsx
          test -s complet.xlsx
          taskkill //F //IM HeptagonesLM.exe || true
          ./HeptagonesLM-Setup.exe --version
          ./HeptagonesLM-Setup.exe setup --simulate --no-open --port 8791 --token ci > setup.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -b "heptagoneslm_setup=ci" localhost:8791/api/info > /dev/null && break; sleep 1; done
          curl -sf -b "heptagoneslm_setup=ci" localhost:8791/api/info | grep -q '"simulated": true'
          taskkill //F //IM HeptagonesLM-Setup.exe || true

      - name: Publication de HeptagonesLM-Setup.exe (seul exécutable livré)
        uses: actions/upload-artifact@v4
        with:
          name: HeptagonesLM-Setup
          path: |
            dist/HeptagonesLM-Setup.exe
            config/heptagoneslm.example.yaml

      - name: HeptagonesLM.exe seul, pour les tests d'installation de la CI (non livré)
        uses: actions/upload-artifact@v4
        with:
          name: interne-tests-HeptagonesLM-exe
          path: dist/HeptagonesLM.exe
          retention-days: 3

  setup-windows:
    name: Installation réelle sur Windows Server (assistant)
    needs: exe
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      SVC_PWD: "Xk7#pQ2v-Lm9z!Ct4"     # compte local jetable, propre à la CI
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: HeptagonesLM-Setup
          path: livrables

      - name: Préparation (compte de service, groupe, certificat, DNS, faux lmutil)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # Cmdlets non interactives (net user demande une confirmation au-delà de 14 caractères)
          $secure = ConvertTo-SecureString $env:SVC_PWD -AsPlainText -Force
          New-LocalUser -Name svc_heptagoneslm -Password $secure -PasswordNeverExpires -UserMayNotChangePassword | Out-Null
          New-LocalGroup -Name HeptagonesLM_Lecteurs | Out-Null
          # Utilisateur de test membre du groupe (connexion NTLM avec identifiants explicites :
          # en boucle locale, NTLM réutiliserait sinon le jeton de session du runner, antérieur au groupe)
          New-LocalUser -Name ci_lecteur -Password $secure -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group HeptagonesLM_Lecteurs -Member ci_lecteur
          $cert = New-SelfSignedCertificate -DnsName "heptagoneslm.ci.local" -CertStoreLocation Cert:\LocalMachine\My
          Get-ChildItem Cert:\LocalMachine\My | Format-Table Thumbprint, Subject, HasPrivateKey
          Add-Content C:\Windows\System32\drivers\etc\hosts "127.0.0.1 heptagoneslm.ci.local"
          # Authentification Windows vers un alias local (environnement de test uniquement)
          New-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Control\Lsa -Name DisableLoopbackCheck -Value 1 -PropertyType DWord -Force | Out-Null
          New-Item -ItemType Directory C:\ci -Force | Out-Null
          Set-Content C:\ci\lmutil.cmd '@"C:\HeptagonesLM\HeptagonesLM.exe" fake-lmutil %*' -Encoding ascii
          $answers = [ordered]@{
            install_dir = "C:\HeptagonesLM"; service_account = "$env:COMPUTERNAME\svc_heptagoneslm"; service_password = '${SVC_PWD}'
            db_mode = "sqlite"; lmutil_path = "C:\ci\lmutil.cmd"
            servers = @(@{ name = "AUTODESK"; port_at_host = "27000@licsrv-adsk" }, @{ name = "ANSYS"; port_at_host = "1055@licsrv-ansys" })
            web_mode = "iis"; public_host = "heptagoneslm.ci.local"; iis_cert_thumbprint = $cert.Thumbprint
            access_group = "$env:COMPUTERNAME\HeptagonesLM_Lecteurs"; auto_fix = $true
          }
          $answers | ConvertTo-Json -Depth 4 | Set-Content answers.json -Encoding utf8
          Get-Content answers.json

      - name: Installation silencieuse (HeptagonesLM-Setup.exe --answers)
        timeout-minutes: 30
        run: |
          .\livrables\dist\HeptagonesLM-Setup.exe setup --answers answers.json
          if ($LASTEXITCODE -ne 0) { throw "Installation : code $LASTEXITCODE" }

      - name: Contrôles après installation
        run: ./tests/windows/post_install_checks.ps1

      - name: Relance de l'installation (idempotence)
        run: |
          $lines = & .\livrables\dist\HeptagonesLM-Setup.exe setup --answers answers.json 2>&1
          $code = $LASTEXITCODE
          $lines | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) { throw "Réinstallation : code $code" }
          # La vérification finale reprend le test d'accès enregistré depuis le « poste » ci_lecteur
          if (-not ($lines -match "ci_lecteur.*NTLM.*sans saisie")) { throw "test d'accès absent de la vérification finale" }
          # HeptagonesLM relancé après la mise à jour de l'exécutable, SSO toujours opérationnel
          $code = curl.exe -sk --ntlm -u "ci_lecteur:$env:SVC_PWD" -o me.json -w "%{http_code}" https://heptagoneslm.ci.local/api/me
          Write-Host "[$code] $(Get-Content me.json -Raw)"
          if ($code -ne "200" -or (Get-Content me.json -Raw | ConvertFrom-Json).user -ne "ci_lecteur") { throw "SSO après réinstallation" }

      - name: Journaux d'installation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installation-windows
          path: |
            C:/HeptagonesLM/logs/
            C:/HeptagonesLM/heptagoneslm.yaml
            C:/HeptagonesLM/iis/web.config
          if-no-files-found: warn

  setup-windows-gui:
    # Installation réelle (Windows Server, sans --simulate) par l'assistant graphique, pilotée par un
    # navigateur et filmée : vidéo, captures et déroulé horodaté publiés dans « installation-reelle ».
    name: Installation réelle filmée (assistant graphique)
    needs: exe
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    env:
      SVC_PWD: "Xk7#pQ2v-Lm9z!Ct4"     # comptes locaux jetables, propres à la CI
      PUBLIC_HOST: heptagoneslm.ci.local
      TOUR_USER: ci_lecteur
      EXPECT_LMUTIL: 'C:\Flexlm\lmutil.exe'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: HeptagonesLM-Setup
          path: livrables

      - uses: actions/download-artifact@v4
        with:
          name: interne-tests-HeptagonesLM-exe
          path: livrables/dist

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Navigateur de test (Playwright, Chromium)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium

      - name: Préparation (compte de service, groupe, certificat, DNS, lmutil.exe de test)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $secure = ConvertTo-SecureString $env:SVC_PWD -AsPlainText -Force
          New-LocalUser -Name svc_heptagoneslm -Password $secure -PasswordNeverExpires -UserMayNotChangePassword | Out-Null
          New-LocalGroup -Name HeptagonesLM_Lecteurs | Out-Null
          New-LocalUser -Name ci_lecteur -Password $secure -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group HeptagonesLM_Lecteurs -Member ci_lecteur
          $cert = New-SelfSignedCertificate -DnsName $env:PUBLIC_HOST -CertStoreLocation Cert:\LocalMachine\My
          Add-Content C:\Windows\System32\drivers\etc\hosts "127.0.0.1 $env:PUBLIC_HOST"
          New-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Control\Lsa -Name DisableLoopbackCheck -Value 1 -PropertyType DWord -Force | Out-Null
          # Seul élément de test : il n'existe pas de serveur FlexLM sur les machines GitHub. Ce lmutil.exe
          # (placé dans C:\Flexlm, à trouver par le bouton « Rechercher l'outil ») relaie vers
          # « HeptagonesLM.exe fake-lmutil », qui répond comme lmstat avec les données de la démonstration.
          New-Item -ItemType Directory C:\ci, C:\Flexlm -Force | Out-Null
          Copy-Item livrables\dist\HeptagonesLM.exe C:\ci\HeptagonesLM.exe
          $src = @'
          using System; using System.Diagnostics; using System.Linq;
          class LmutilTest {
            static int Main(string[] args) {
              var psi = new ProcessStartInfo(@"C:\ci\HeptagonesLM.exe", "fake-lmutil " + string.Join(" ", args.Select(a => "\"" + a + "\"")));
              psi.UseShellExecute = false;
              var p = Process.Start(psi); p.WaitForExit(); return p.ExitCode;
            }
          }
          '@
          Set-Content C:\ci\lmutil.cs $src -Encoding utf8
          & "$env:windir\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /out:C:\Flexlm\lmutil.exe C:\ci\lmutil.cs
          if ($LASTEXITCODE -ne 0) { throw "compilation de lmutil.exe" }
          # Sortie complète d'abord (couper le tube interrompt le programme : code de sortie 1)
          $sortie = & C:\Flexlm\lmutil.exe lmstat -a -c 27000@licsrv-adsk
          if ($LASTEXITCODE -ne 0) { throw "lmutil.exe de test : code $LASTEXITCODE" }
          $sortie | Select-Object -First 4
          Add-Content $env:GITHUB_ENV "CERT_THUMB=$($cert.Thumbprint)"
          Add-Content $env:GITHUB_ENV "SVC_ACCOUNT=$env:COMPUTERNAME\svc_heptagoneslm"
          Add-Content $env:GITHUB_ENV "ACCESS_GROUP=$env:COMPUTERNAME\HeptagonesLM_Lecteurs"

      - name: Assistant d'installation réel, piloté par le navigateur et filmé
        timeout-minutes: 50
        run: |
          $p = Start-Process .\livrables\dist\HeptagonesLM-Setup.exe -ArgumentList "setup", "--no-open", "--port", "8792", "--token", "ci-reel" `
               -RedirectStandardOutput setup-gui.log -RedirectStandardError setup-gui.err -PassThru
          for ($i = 0; $i -lt 90; $i++) {
            if ((curl.exe -s -o NUL -w "%{http_code}" http://127.0.0.1:8792/setup.css) -ne "000") { break }
            Start-Sleep 1
          }
          node tests/ui/setup_real.cjs http://127.0.0.1:8792 ci-reel installation-reelle
          $code = $LASTEXITCODE
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if ($code -ne 0) { Get-Content setup-gui.log, setup-gui.err -Tail 60 -ErrorAction SilentlyContinue; throw "parcours réel de l'assistant en échec" }

      - name: Contrôles après installation (SSO via IIS, groupes, collecte par le compte de service)
        run: ./tests/windows/post_install_checks.ps1

      - name: Visite filmée de l'interface installée (IIS, connexion Windows)
        continue-on-error: true
        run: node tests/ui/web_real_tour.cjs installation-reelle

      - name: Regroupement des journaux d'installation
        if: always()
        run: |
          # Un artefact ne peut pas mélanger l'espace de travail (D:) et C: : copie dans le dossier publié
          $dest = New-Item -ItemType Directory installation-reelle\installation -Force
          foreach ($f in "setup-gui.log", "setup-gui.err", "C:\HeptagonesLM\heptagoneslm.yaml", "C:\HeptagonesLM\iis\web.config") {
            if (Test-Path $f) { Copy-Item $f $dest }
          }
          if (Test-Path C:\HeptagonesLM\logs) { Copy-Item C:\HeptagonesLM\logs (Join-Path $dest logs) -Recurse }

      - name: Publication de la vidéo, des captures et des journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installation-reelle
          path: installation-reelle/
          if-no-files-found: warn

  sqlserver:
    name: SQL Server 2022 (base réelle)
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Mot de passe d'un conteneur jetable, propre à la CI.
          MSSQL_SA_PASSWORD: "HeptagonesLM-CI-2024!"
        ports:
          - 1433:1433
    env:
      HEPTAGONESLM_DB: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=localhost,1433;DATABASE=HeptagonesLM;UID=sa;PWD=HeptagonesLM-CI-2024!;TrustServerCertificate=yes"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pilote ODBC Driver 18 for SQL Server
        run: |
          if ! (command -v odbcinst > /dev/null && odbcinst -q -d | grep -q "ODBC Driver 18 for SQL Server"); then
            # Dépôt Microsoft : souvent déjà présent sur les runners GitHub
            if ! grep -rqs "packages.microsoft.com" /etc/apt/sources.list /etc/apt/sources.list.d/; then
              curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
              curl -fsSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list
            fi
            sudo apt-get update -qq
            sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18 unixodbc
          fi
          odbcinst -q -d

      - name: Installation
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Création de la base HeptagonesLM
        run: |
          python - <<'EOF'
          import os, time, pyodbc
          cs = os.environ["HEPTAGONESLM_DB"].replace("DATABASE=HeptagonesLM", "DATABASE=master")
          for attempt in range(60):
              try:
                  conn = pyodbc.connect(cs, autocommit=True, timeout=5)
                  break
              except pyodbc.Error as exc:
                  print("En attente de SQL Server...", exc)
                  time.sleep(2)
          else:
              raise SystemExit("SQL Server indisponible")
          print(conn.execute("SELECT @@VERSION").fetchone()[0])
          conn.execute("IF DB_ID('HeptagonesLM') IS NULL CREATE DATABASE HeptagonesLM")
          EOF

      - name: Démo sur SQL Server
        run: heptagoneslm demo --days 14 --output-dir demo-mssql --connection-string "$HEPTAGONESLM_DB"

      - name: Idempotence du schéma et collecte en direct
        run: |
          heptagoneslm -c demo-mssql/heptagoneslm.demo.yaml init-db
          heptagoneslm -c demo-mssql/heptagoneslm.demo.yaml init-db
          heptagoneslm -c demo-mssql/heptagoneslm.demo.yaml collect
          heptagoneslm -c demo-mssql/heptagoneslm.demo.yaml purge
          heptagoneslm -c demo-mssql/heptagoneslm.demo.yaml report --period last-7d -o demo-mssql/reports/HeptagonesLM_mssql_7j.xlsx

      - name: Alertes et tickets ITSM sur SQL Server (évaluation, état, anti-répétition)
        run: |
          python - <<'EOF'
          import json, threading
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          import yaml
          from heptagoneslm.alerts import check_and_notify
          from heptagoneslm.config import parse_config
          from heptagoneslm.storage import Database
          hooks = []
          class Hook(BaseHTTPRequestHandler):
              def log_message(self, *a): pass
              def do_POST(self):
                  hooks.append(json.loads(self.rfile.read(int(self.headers["Content-Length"]))))
                  self.send_response(200); self.send_header("Content-Length", "0"); self.end_headers()
          srv = ThreadingHTTPServer(("127.0.0.1", 0), Hook)
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          raw = yaml.safe_load(open("demo-mssql/heptagoneslm.demo.yaml", encoding="utf-8"))
          raw["email"] = {"smtp_host": "localhost", "sender": "ci@entreprise.local"}
          raw["alerts"] = {"recipients": ["ci@entreprise.local"], "expiry_days": 400,
                           "itsm": [{"type": "webhook", "url": f"http://127.0.0.1:{srv.server_address[1]}/hook",
                                     "allow_http": True, "min_severity": "warning"}]}
          cfg = parse_config(raw)
          sent = []
          with Database(cfg.database.connection_string) as db:
              first = check_and_notify(cfg, db, sender=lambda msg, c: sent.append(msg))
              again = check_and_notify(cfg, db, sender=lambda msg, c: sent.append(msg))
              states = db.scalar("SELECT COUNT(*) FROM alert_state")
              tickets = db.scalar("SELECT COUNT(*) FROM itsm_ticket WHERE status = 'OPEN'")
          print(first.status, *[f"[{a.severity}] {a.title}" for a in first.alerts], sep="\n  ")
          print("tickets :", *first.tickets, sep="\n  ")
          print("2e évaluation :", again.status, "- états :", states, "- tickets ouverts :", tickets)
          assert first.status == "SENT" and len(sent) == 1, first
          assert again.status == "NONE" and not again.tickets, (again.status, again.tickets)
          assert states >= len(first.alerts) and tickets == len(hooks) >= 1, (states, tickets, len(hooks))
          EOF

      - name: Verrou de collecte (deux collectes simultanées)
        run: |
          python - <<'EOF' &
          import os, time, pyodbc
          conn = pyodbc.connect(os.environ["HEPTAGONESLM_DB"], autocommit=True)
          conn.execute("EXEC sp_getapplock @Resource = 'heptagoneslm_collect', @LockMode = 'Exclusive', @LockOwner = 'Session'")
          open("lock_held", "w").close()
          time.sleep(30)
          EOF
          for i in $(seq 1 30); do [ -f lock_held ] && break; sleep 1; done
          heptagoneslm -c demo-mssql/heptagoneslm.demo.yaml collect | tee collect.out
          grep -q "déjà en cours" collect.out
          wait

      - name: Envoi de rapport (aperçu .eml) sur SQL Server
        run: |
          heptagoneslm -c demo-mssql/heptagoneslm.demo.yaml send-report --to test@example.com --period last-7d --dry-run eml
          ls eml/*.eml

      - name: Contrôle des vues SQL
        run: |
          python - <<'EOF'
          import os, pyodbc
          conn = pyodbc.connect(os.environ["HEPTAGONESLM_DB"])
          for view in ("v_session_detail", "v_usage_hourly", "v_denial"):
              n = conn.execute(f"SELECT COUNT(*) FROM dbo.{view}").fetchone()[0]
              print(f"{view:<18} {n:>8} lignes")
              assert n > 0, view
          for row in conn.execute(
              "SELECT TOP 5 product, username, checkout_time, checkin_time, duration_min "
              "FROM dbo.v_session_detail ORDER BY duration_min DESC"
          ):
              print(" ", tuple(row))
          EOF

      - name: Relance de la démo (remplacement des données de démonstration)
        run: heptagoneslm demo --days 3 --output-dir demo-mssql-bis --connection-string "$HEPTAGONESLM_DB" --no-report

      - name: Publication du rapport SQL Server
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-demo-sqlserver
          path: demo-mssql/reports/
          if-no-files-found: warn
