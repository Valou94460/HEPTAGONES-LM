# Intégration continue + environnement de test simulé.
#
# - tests      : tests unitaires + démo (historique simulé, collecte en direct via
#                le faux lmutil, rapport Excel) sous Linux et Windows.
# - sqlserver  : la même démo contre un vrai SQL Server 2022 (conteneur).
#
# Les rapports Excel générés sont téléchargeables dans l'onglet « Actions »
# du dépôt, section « Artifacts » de chaque exécution.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      days:
        description: "Nombre de jours d'historique simulé"
        default: "30"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Tests + démo (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Installation
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests unitaires
        run: python -m pytest -v

      - name: Script SQL Server à jour
        if: runner.os == 'Linux'
        run: freelm ddl --dialect mssql | diff - sql/sqlserver/01_schema.sql

      - name: Démo - historique simulé et rapport Excel
        run: freelm demo --days "${{ inputs.days || '30' }}" --output-dir demo

      - name: Démo - collecte en direct avec le faux lmutil
        run: |
          freelm -c demo/freelm.demo.yaml test-server --server AUTODESK
          freelm -c demo/freelm.demo.yaml collect
          freelm -c demo/freelm.demo.yaml collect
          freelm -c demo/freelm.demo.yaml report --period last-7d -o demo/reports/FreeLM_7_derniers_jours.xlsx
          freelm -c demo/freelm.demo.yaml report --period last-7d -o demo/reports/FreeLM_7_derniers_jours.xlsx --skip-existing

      - name: Vérification des classeurs Excel
        run: |
          python - <<'EOF'
          import glob
          from openpyxl import load_workbook
          files = sorted(glob.glob("demo/reports/*.xlsx"))
          assert files, "aucun rapport généré"
          for path in files:
              wb = load_workbook(path)
              print(path)
              for ws in wb.worksheets:
                  print(f"  {ws.title:<16} {ws.max_row:>6} lignes  {len(ws.tables)} tableau(x)")
              assert wb["Synthèse"].max_row > 5, "synthèse vide"
              assert wb["Sessions"].max_row > 5, "aucune session"
          EOF

      - name: Rendu PDF du rapport (LibreOffice)
        if: runner.os == 'Linux' && matrix.python == '3.12'
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-calc > /dev/null
          soffice --headless --convert-to pdf --outdir demo/reports demo/reports/FreeLM_demo_*.xlsx

      - name: Publication du rapport de démonstration
        if: always() && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: rapport-demo-${{ runner.os }}
          path: |
            demo/reports/
            demo/logs/
            demo/freelm.demo.yaml
          if-no-files-found: warn

  ui:
    name: Interface web (navigateur)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installation
        run: |
          pip install -e ".[dev]"
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Démarrage de l'interface (données de démonstration)
        run: |
          freelm web --demo --demo-days 60 --port 8765 > web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8765/api/meta > /dev/null && break; sleep 1; done
          curl -sf localhost:8765/api/meta > /dev/null || (cat web.log; exit 1)

      - name: Test de bout en bout (Playwright)
        run: node tests/ui/ui_smoke.cjs http://localhost:8765 ui-captures

      - name: Connexion Windows/AD (annuaire factice)
        run: |
          python tests/ui/fake_auth_server.py 8766 > auth.log 2>&1 &
          for i in $(seq 1 60); do grep -q "prêt" auth.log && break; sleep 1; done
          node tests/ui/login_smoke.cjs http://localhost:8766 ui-captures

      - name: Assistant d'installation (simulation)
        run: |
          freelm setup --simulate --no-open --port 8790 --token ci-token > setup.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null localhost:8790/setup.css && break; sleep 1; done
          node tests/ui/setup_smoke.cjs http://127.0.0.1:8790 ci-token ui-captures

      - name: Captures d'écran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-interface-web
          path: ui-captures/
          if-no-files-found: warn

  exe:
    name: Exécutable Windows (FreeLM.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Construction
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
          pyinstaller --noconfirm --clean --onefile --console --name FreeLM \
            --collect-submodules freelm --add-data "freelm/web/static:freelm/web/static" \
            --add-data "freelm/setup/static:freelm/setup/static" freelm/launcher.py
          # Assistant d'installation : élévation administrateur, FreeLM.exe embarqué
          pyinstaller --noconfirm --onefile --console --uac-admin --name FreeLM-Setup \
            --collect-submodules freelm --add-data "freelm/web/static:freelm/web/static" \
            --add-data "freelm/setup/static:freelm/setup/static" --add-data "dist/FreeLM.exe:." freelm/launcher.py

      - name: Vérification de l'exécutable
        run: |
          cd dist
          ./FreeLM.exe --version
          ./FreeLM.exe demo --days 5 --output-dir exe-demo
          ./FreeLM.exe -c exe-demo/freelm.demo.yaml collect
          ./FreeLM.exe web --demo --demo-days 10 --port 8799 > web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8799/api/meta > /dev/null && break; sleep 1; done
          curl -sf localhost:8799/ | grep -q "FreeLM"
          curl -sf "localhost:8799/api/report?type=summary" | grep -q "Synthèse"
          curl -sf "localhost:8799/api/export?type=full&format=xlsx" -o complet.xlsx
          test -s complet.xlsx
          taskkill //F //IM FreeLM.exe || true
          ./FreeLM-Setup.exe --version
          ./FreeLM-Setup.exe setup --simulate --no-open --port 8791 --token ci > setup.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -b "freelm_setup=ci" localhost:8791/api/info > /dev/null && break; sleep 1; done
          curl -sf -b "freelm_setup=ci" localhost:8791/api/info | grep -q '"simulated": true'
          taskkill //F //IM FreeLM-Setup.exe || true

      - name: Publication de FreeLM.exe et FreeLM-Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: FreeLM-windows
          path: |
            dist/FreeLM.exe
            dist/FreeLM-Setup.exe
            config/freelm.example.yaml

  setup-windows:
    name: Installation réelle sur Windows Server (assistant)
    needs: exe
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      SVC_PWD: "Xk7#pQ2v-Lm9z!Ct4"     # compte local jetable, propre à la CI
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: FreeLM-windows
          path: livrables

      - name: Préparation (compte de service, groupe, certificat, DNS, faux lmutil)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # Cmdlets non interactives (net user demande une confirmation au-delà de 14 caractères)
          $secure = ConvertTo-SecureString $env:SVC_PWD -AsPlainText -Force
          New-LocalUser -Name svc_freelm -Password $secure -PasswordNeverExpires -UserMayNotChangePassword | Out-Null
          New-LocalGroup -Name FreeLM_Lecteurs | Out-Null
          Add-LocalGroupMember -Group FreeLM_Lecteurs -Member $env:USERNAME
          $cert = New-SelfSignedCertificate -DnsName "freelm.ci.local" -CertStoreLocation Cert:\LocalMachine\My
          Get-ChildItem Cert:\LocalMachine\My | Format-Table Thumbprint, Subject, HasPrivateKey
          Add-Content C:\Windows\System32\drivers\etc\hosts "127.0.0.1 freelm.ci.local"
          # Authentification Windows vers un alias local (environnement de test uniquement)
          New-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Control\Lsa -Name DisableLoopbackCheck -Value 1 -PropertyType DWord -Force | Out-Null
          New-Item -ItemType Directory C:\ci -Force | Out-Null
          Set-Content C:\ci\lmutil.cmd '@"C:\FreeLM\FreeLM.exe" fake-lmutil %*' -Encoding ascii
          $answers = [ordered]@{
            install_dir = "C:\FreeLM"; service_account = "$env:COMPUTERNAME\svc_freelm"; service_password = '${SVC_PWD}'
            db_mode = "sqlite"; lmutil_path = "C:\ci\lmutil.cmd"
            servers = @(@{ name = "AUTODESK"; port_at_host = "27000@licsrv-adsk" }, @{ name = "ANSYS"; port_at_host = "1055@licsrv-ansys" })
            web_mode = "iis"; public_host = "freelm.ci.local"; iis_cert_thumbprint = $cert.Thumbprint
            access_group = "$env:COMPUTERNAME\FreeLM_Lecteurs"; auto_fix = $true
          }
          $answers | ConvertTo-Json -Depth 4 | Set-Content answers.json -Encoding utf8
          Get-Content answers.json

      - name: Installation silencieuse (FreeLM-Setup.exe --answers)
        timeout-minutes: 30
        run: |
          .\livrables\dist\FreeLM-Setup.exe setup --answers answers.json
          if ($LASTEXITCODE -ne 0) { throw "Installation : code $LASTEXITCODE" }

      - name: Contrôles après installation
        run: |
          Get-ScheduledTask -TaskPath "\FreeLM\" | Format-Table TaskName, State, @{n='Compte';e={$_.Principal.UserId}}
          & "$env:windir\system32\inetsrv\appcmd.exe" list site
          # Diagnostic : réponse brute via IIS (statut, en-têtes, corps), puis journal IIS
          $r = Invoke-WebRequest "https://freelm.ci.local/api/me" -UseDefaultCredentials -SkipCertificateCheck -SkipHttpErrorCheck
          Write-Host "GET /api/me via IIS : $($r.StatusCode)"
          $r.Headers.GetEnumerator() | ForEach-Object { Write-Host "  $($_.Key): $($_.Value)" }
          Write-Host $r.Content
          Get-ChildItem C:\inetpub\logs\LogFiles -Recurse -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "== $($_.FullName)"; Get-Content $_.FullName -Tail 15 }
          Get-Content C:\FreeLM\logs\*.log -Tail 20 -ErrorAction SilentlyContinue
          # Authentification unique : IIS (Windows) -> FreeLM (en-tête X-Remote-User)
          $meta = Invoke-RestMethod "https://freelm.ci.local/api/meta" -UseDefaultCredentials -SkipCertificateCheck
          if (-not $meta.version) { throw "API FreeLM inaccessible via IIS" }
          $me = Invoke-RestMethod "https://freelm.ci.local/api/me" -UseDefaultCredentials -SkipCertificateCheck
          Write-Host "Utilisateur vu par FreeLM via IIS : $($me.user) ($($me.auth))"
          if ($me.auth -ne "header" -or -not $me.user) { throw "Authentification unique non transmise" }
          # Sans identifiants : refus par IIS
          try { Invoke-WebRequest "https://freelm.ci.local/" -SkipCertificateCheck -ErrorAction Stop; throw "accès anonyme accepté" }
          catch { if ($_.Exception.Response.StatusCode.value__ -ne 401) { throw $_ } }
          # Collecte planifiée exécutée par le compte de service
          Start-ScheduledTask -TaskPath "\FreeLM\" -TaskName "FreeLM - Collecte"
          Start-Sleep 20
          $info = Get-ScheduledTask -TaskPath "\FreeLM\" -TaskName "FreeLM - Collecte" | Get-ScheduledTaskInfo
          Write-Host "Collecte planifiée : dernier résultat $($info.LastTaskResult)"
          if ($info.LastTaskResult -ne 0) { Get-Content C:\FreeLM\logs\freelm.log -Tail 40; throw "collecte planifiée en échec" }

      - name: Relance de l'installation (idempotence)
        run: |
          .\livrables\dist\FreeLM-Setup.exe setup --answers answers.json
          if ($LASTEXITCODE -ne 0) { throw "Réinstallation : code $LASTEXITCODE" }

      - name: Journaux d'installation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installation-windows
          path: |
            C:/FreeLM/logs/
            C:/FreeLM/freelm.yaml
            C:/FreeLM/iis/web.config
          if-no-files-found: warn

  sqlserver:
    name: SQL Server 2022 (base réelle)
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Mot de passe d'un conteneur jetable, propre à la CI.
          MSSQL_SA_PASSWORD: "FreeLM-CI-2024!"
        ports:
          - 1433:1433
    env:
      FREELM_DB: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=localhost,1433;DATABASE=FreeLM;UID=sa;PWD=FreeLM-CI-2024!;TrustServerCertificate=yes"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pilote ODBC Driver 18 for SQL Server
        run: |
          if ! (command -v odbcinst > /dev/null && odbcinst -q -d | grep -q "ODBC Driver 18 for SQL Server"); then
            # Dépôt Microsoft : souvent déjà présent sur les runners GitHub
            if ! grep -rqs "packages.microsoft.com" /etc/apt/sources.list /etc/apt/sources.list.d/; then
              curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
              curl -fsSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list
            fi
            sudo apt-get update -qq
            sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18 unixodbc
          fi
          odbcinst -q -d

      - name: Installation
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Création de la base FreeLM
        run: |
          python - <<'EOF'
          import os, time, pyodbc
          cs = os.environ["FREELM_DB"].replace("DATABASE=FreeLM", "DATABASE=master")
          for attempt in range(60):
              try:
                  conn = pyodbc.connect(cs, autocommit=True, timeout=5)
                  break
              except pyodbc.Error as exc:
                  print("En attente de SQL Server...", exc)
                  time.sleep(2)
          else:
              raise SystemExit("SQL Server indisponible")
          print(conn.execute("SELECT @@VERSION").fetchone()[0])
          conn.execute("IF DB_ID('FreeLM') IS NULL CREATE DATABASE FreeLM")
          EOF

      - name: Démo sur SQL Server
        run: freelm demo --days 14 --output-dir demo-mssql --connection-string "$FREELM_DB"

      - name: Idempotence du schéma et collecte en direct
        run: |
          freelm -c demo-mssql/freelm.demo.yaml init-db
          freelm -c demo-mssql/freelm.demo.yaml init-db
          freelm -c demo-mssql/freelm.demo.yaml collect
          freelm -c demo-mssql/freelm.demo.yaml purge
          freelm -c demo-mssql/freelm.demo.yaml report --period last-7d -o demo-mssql/reports/FreeLM_mssql_7j.xlsx

      - name: Verrou de collecte (deux collectes simultanées)
        run: |
          python - <<'EOF' &
          import os, time, pyodbc
          conn = pyodbc.connect(os.environ["FREELM_DB"], autocommit=True)
          conn.execute("EXEC sp_getapplock @Resource = 'freelm_collect', @LockMode = 'Exclusive', @LockOwner = 'Session'")
          open("lock_held", "w").close()
          time.sleep(30)
          EOF
          for i in $(seq 1 30); do [ -f lock_held ] && break; sleep 1; done
          freelm -c demo-mssql/freelm.demo.yaml collect | tee collect.out
          grep -q "déjà en cours" collect.out
          wait

      - name: Envoi de rapport (aperçu .eml) sur SQL Server
        run: |
          freelm -c demo-mssql/freelm.demo.yaml send-report --to test@example.com --period last-7d --dry-run eml
          ls eml/*.eml

      - name: Contrôle des vues SQL
        run: |
          python - <<'EOF'
          import os, pyodbc
          conn = pyodbc.connect(os.environ["FREELM_DB"])
          for view in ("v_session_detail", "v_usage_hourly", "v_denial"):
              n = conn.execute(f"SELECT COUNT(*) FROM dbo.{view}").fetchone()[0]
              print(f"{view:<18} {n:>8} lignes")
              assert n > 0, view
          for row in conn.execute(
              "SELECT TOP 5 product, username, checkout_time, checkin_time, duration_min "
              "FROM dbo.v_session_detail ORDER BY duration_min DESC"
          ):
              print(" ", tuple(row))
          EOF

      - name: Relance de la démo (remplacement des données de démonstration)
        run: freelm demo --days 3 --output-dir demo-mssql-bis --connection-string "$FREELM_DB" --no-report

      - name: Publication du rapport SQL Server
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-demo-sqlserver
          path: demo-mssql/reports/
          if-no-files-found: warn
