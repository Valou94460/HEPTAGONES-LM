# Publication d'une version, au choix :
# - `git tag v26.2.0 && git push origin v26.2.0` ;
# - onglet Actions › Release › « Run workflow » avec l'étiquette v26.2.0 : l'étiquette
#   est créée sur le commit construit (main) au moment de la publication.
# L'étiquette doit correspondre à la version du code (heptagoneslm/__init__.py).
#
# Sécurité de la chaîne de publication :
# - le job « build » (tests, installation des dépendances, PyInstaller) n'a qu'un
#   droit de LECTURE sur le dépôt : une dépendance compromise ne peut pas altérer
#   la release ni le code ;
# - le job « publish » a le droit d'écriture mais n'exécute aucun code tiers : il
#   calcule les empreintes SHA-256 et crée la release avec les fichiers construits.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Étiquette à créer sur main (ex. v26.1.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Construction ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Contrôle de l'étiquette
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Publication manuelle réservée à la branche main (lancée depuis $GITHUB_REF)"; exit 1
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Étiquette invalide : $TAG (attendu vAA.N.C)"; exit 1; }
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('heptagoneslm/__init__.py').read()).group(1))")
          [ "v$version" = "$TAG" ] || { echo "L'étiquette $TAG ne correspond pas à la version du code ($version)"; exit 1; }
          echo "Publication de $TAG (version du code : $version, commit $GITHUB_SHA)"

      - name: Tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller
          python -m pytest -q

      - name: Construction de HeptagonesLM.exe
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name HeptagonesLM --icon packaging/heptagoneslm.ico \
            --collect-submodules heptagoneslm --add-data "heptagoneslm/web/static:heptagoneslm/web/static" \
            --add-data "heptagoneslm/setup/static:heptagoneslm/setup/static" heptagoneslm/launcher.py
          ./dist/HeptagonesLM.exe --version

      # Signature uniquement avec le certificat de l'éditeur (secrets SIGN_PFX_BASE64 / SIGN_PFX_PASSWORD) :
      # une release n'est jamais signée avec le certificat de test.
      - name: Signature de HeptagonesLM.exe
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          if ($env:SIGN_PFX_BASE64) { ./packaging/sign.ps1 dist/HeptagonesLM.exe }
          else { Write-Warning "Aucun certificat de signature (secret SIGN_PFX_BASE64) : exécutables non signés" }

      - name: Construction de HeptagonesLM-Setup.exe
        run: |
          pyinstaller --noconfirm --onefile --console --uac-admin --name HeptagonesLM-Setup --icon packaging/heptagoneslm.ico \
            --collect-submodules heptagoneslm --add-data "heptagoneslm/web/static:heptagoneslm/web/static" \
            --add-data "heptagoneslm/setup/static:heptagoneslm/setup/static" --add-data "dist/HeptagonesLM.exe:." heptagoneslm/launcher.py
          ./dist/HeptagonesLM-Setup.exe --version

      - name: Signature de HeptagonesLM-Setup.exe
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          if ($env:SIGN_PFX_BASE64) { ./packaging/sign.ps1 dist/HeptagonesLM-Setup.exe }

      - name: Vérification rapide
        run: |
          cd dist
          ./HeptagonesLM.exe demo --days 3 --output-dir verif
          test -s verif/reports/*.xlsx

      - name: Paquet de distribution
        run: |
          mkdir -p paquet/HeptagonesLM/sql paquet/HeptagonesLM/scripts
          # Un seul exécutable livré : l'assistant (il contient HeptagonesLM.exe et l'installe sur le serveur)
          cp dist/HeptagonesLM-Setup.exe README.md LICENSE CHANGELOG.md paquet/HeptagonesLM/
          cp config/heptagoneslm.example.yaml paquet/HeptagonesLM/heptagoneslm.example.yaml
          cp sql/sqlserver/*.sql paquet/HeptagonesLM/sql/
          cp scripts/*.ps1 scripts/*.bat paquet/HeptagonesLM/scripts/
          mkdir -p livrables
          cp dist/HeptagonesLM-Setup.exe livrables/
          (cd paquet && 7z a -tzip "../livrables/HeptagonesLM-${TAG}-windows.zip" HeptagonesLM > /dev/null)

      - uses: actions/upload-artifact@v4
        with:
          name: livrables
          path: livrables/
          if-no-files-found: error

  publish:
    name: Publication ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: livrables
          path: livrables

      - name: Empreintes SHA-256
        run: |
          cd livrables
          sha256sum HeptagonesLM-Setup.exe "HeptagonesLM-${TAG}-windows.zip" > SHA256SUMS
          cat SHA256SUMS

      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd livrables
          files=(HeptagonesLM-Setup.exe "HeptagonesLM-${TAG}-windows.zip" SHA256SUMS)
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Release déjà créée (depuis l'interface GitHub) : on y joint les fichiers construits
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            # Crée l'étiquette sur le commit construit si elle n'existe pas encore (lancement manuel)
            gh release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" \
              --title "HeptagonesLM $TAG" --generate-notes \
              --notes "Installation sur serveur : HeptagonesLM-Setup.exe (assistant graphique). Vérifier l'intégrité : \`Get-FileHash HeptagonesLM-Setup.exe -Algorithm SHA256\` doit correspondre à SHA256SUMS."
          fi
