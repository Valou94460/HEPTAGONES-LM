<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FreeLM — Connexion</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body class="login-page">
  <main class="login-card card">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="var(--accent)"/>
        <rect x="7" y="17" width="4" height="8" rx="1.5" fill="#fff" opacity=".7"/>
        <rect x="14" y="11" width="4" height="14" rx="1.5" fill="#fff" opacity=".85"/>
        <rect x="21" y="6" width="4" height="19" rx="1.5" fill="#fff"/>
      </svg>
      <div>
        <h1>FreeLM</h1>
        <p class="subtitle">Suivi et reporting des licences FlexLM</p>
      </div>
    </div>
    <form id="login-form" novalidate>
      <label class="field">
        <span>Identifiant Windows</span>
        <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus placeholder="identifiant ou DOMAINE\identifiant">
      </label>
      <label class="field">
        <span>Mot de passe</span>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </label>
      <div id="login-error" class="error" role="alert" hidden></div>
      <button type="submit" id="login-submit" class="btn primary">Se connecter</button>
      <p class="muted login-hint">Utilisez votre compte de session Windows.</p>
    </form>
  </main>
  <script src="login.js"></script>
</body>
</html>
