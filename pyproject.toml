[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "heptagoneslm"
version = "26.2.0"
description = "Suivi et reporting open source de la consommation de licences FlexLM/FlexNet"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "pyodbc>=5.0",
    "ldap3>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
heptagoneslm = "heptagoneslm.cli:main"

[tool.setuptools.packages.find]
include = ["heptagoneslm*"]

[tool.setuptools.package-data]
"heptagoneslm.web" = ["static/*"]
"heptagoneslm.setup" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
