# ---------------------------------------------------------------------------
# Alertes immédiates : e-mail et / ou tickets ITSM, évaluées après chaque collecte
# (ou : heptagoneslm check-alerts ; test des connecteurs : heptagoneslm test-itsm)
# ---------------------------------------------------------------------------
# alerts:
#   recipients: [exploitation@entreprise.local]   # e-mail (nécessite email.smtp_host) ; vide = pas d'e-mail
#   types: [collection, denial, saturation, expiry]   # défaut : toutes
#   # collection : collecte en échec / arrêtée (+ « rétablie ») ; denial : nouveaux refus ;
#   # saturation : plus aucun jeton disponible ; expiry : licence qui expire (J-30, J-7, expirée)
#   # servers: [ANSYS]           # limiter à ces serveurs (défaut : tous)
#   # products: ["AutoCAD 2024"] # limiter à ces produits (défaut : tous)
#   expiry_days: 30              # préavis avant l'échéance
#   repeat_hours: 24             # rappel d'une alerte toujours présente (et commentaire sur le ticket)
#   min_denials: 1               # refus minimum pour alerter sur un produit
#
#   # Tickets : ouverts à l'apparition, commentés aux rappels, résolus quand la condition disparaît.
#   # Communs : name, types, min_severity (info | warning | serious | critical, défaut serious),
#   #           timeout_s, verify_tls, ca_file (AC interne), fields (champs supplémentaires à la création)
#   itsm:
#     - type: servicenow
#       url: https://entreprise.service-now.com
#       username: svc_heptagoneslm
#       password: ${HEPTAGONESLM_ITSM_PASSWORD}
#       assignment_group: "Support licences"       # optionnel
#       caller: svc_heptagoneslm                   # optionnel
#     - type: jira
#       url: https://entreprise.atlassian.net      # ou Jira Data Center
#       username: svc-heptagoneslm@entreprise.fr   # Cloud : e-mail + jeton d'API ; Data Center : jeton seul (PAT)
#       token: ${HEPTAGONESLM_JIRA_TOKEN}
#       project: LIC
#       issue_type: Incident
#       # resolve_transitions: ["Done", "Terminé"]  # transition utilisée pour résoudre
#     - type: glpi
#       url: https://glpi.entreprise.local/apirest.php
#       app_token: ${HEPTAGONESLM_GLPI_APP_TOKEN}
#       user_token: ${HEPTAGONESLM_GLPI_USER_TOKEN}
#       entity_id: 0                               # optionnel
#       category_id: 12                            # optionnel
#     - type: webhook                              # Teams, Slack ou tout outil acceptant du JSON
#       name: teams-exploitation
#       url: ${HEPTAGONESLM_TEAMS_WEBHOOK}
#       format: teams                              # json | teams | slack
#       min_severity: warning

retention:
  snapshots_days: 90       # sondages bruts ; les agrégats horaires sont conservés
  events_days: 730         # refus, journal des collectes
